<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Song of the Day</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;background:transparent!important}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.widget{width:min(700px,calc(100% - 16px));margin:8px auto;padding:22px;background:#fff;border:1px solid rgba(82,127,167,.15);border-radius:18px;box-shadow:0 3px 14px rgba(42,71,96,.05)}
.kicker{margin-bottom:16px;color:#88a4bc;font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.player{display:flex;align-items:center;gap:22px}
.visuals{display:flex;align-items:center;gap:12px;flex:none}
.vinyl{position:relative;width:126px;height:126px;border-radius:50%;background:repeating-radial-gradient(circle,#25282b 0 2px,#17191b 3px 5px);box-shadow:0 7px 18px rgba(19,28,35,.16);animation:spin 7s linear infinite}
.vinyl:before{content:"";position:absolute;inset:44px;border-radius:50%;background:#527fa7;border:7px solid #dce7ef}
.vinyl:after{content:"";position:absolute;left:50%;top:50%;width:7px;height:7px;transform:translate(-50%,-50%);border-radius:50%;background:#fff}
@keyframes spin{to{transform:rotate(360deg)}}
.cover{width:104px;height:104px;object-fit:cover;border-radius:10px;background:#eef4f8;box-shadow:0 3px 10px rgba(42,71,96,.09);display:none}
.details{min-width:0;flex:1}
.date{margin-bottom:7px;color:#91aabd;font-size:11px;font-weight:500}
.title{margin:0;color:#456f94;font-size:clamp(19px,4vw,27px);font-weight:600;line-height:1.15;letter-spacing:-.03em;overflow-wrap:anywhere}
.spotify{display:none;align-items:center;gap:7px;margin-top:15px;padding:8px 12px;color:#527fa7;background:#f7fafc;border:1px solid rgba(82,127,167,.17);border-radius:999px;font-size:11px;font-weight:600;text-decoration:none;width:max-content}
.spotify-dot{width:7px;height:7px;border-radius:50%;background:#527fa7}
.editor{display:flex;gap:8px;margin-top:20px;padding-top:18px;border-top:1px solid rgba(82,127,167,.10)}
.input{min-width:0;flex:1;padding:11px 13px;border:1px solid rgba(82,127,167,.20);border-radius:11px;outline:none;color:#456f94;background:#fbfdfe;font:inherit;font-size:12px}
.input:focus{border-color:rgba(82,127,167,.48);box-shadow:0 0 0 3px rgba(82,127,167,.07)}
.input::placeholder{color:#a9b9c6}
.button{flex:none;padding:0 16px;border:0;border-radius:11px;background:#527fa7;color:white;font:inherit;font-size:11px;font-weight:600;cursor:pointer}
.button:active{transform:translateY(1px)}
.message{min-height:15px;margin-top:8px;color:#94aabd;font-size:9px;line-height:1.4}
@media(prefers-reduced-motion:reduce){.vinyl{animation:none}}
@media(max-width:570px){
.widget{padding:18px}.player{gap:14px}.visuals{gap:8px}.vinyl{width:92px;height:92px}.vinyl:before{inset:32px;border-width:5px}.cover{width:74px;height:74px}.title{font-size:18px}
}
@media(max-width:430px){
.player{flex-direction:column;align-items:flex-start}.editor{flex-direction:column}.button{height:40px}.visuals{width:100%}
}
</style>
</head>
<body>
<section class="widget">
  <div class="kicker">Song of the day</div>

  <div class="player">
    <div class="visuals" aria-hidden="true">
      <div class="vinyl"></div>
      <img id="cover" class="cover" alt="">
    </div>

    <div class="details">
      <div class="date" id="date"></div>
      <h1 id="title" class="title">Paste a Spotify song below</h1>
      <a id="spotify" class="spotify" target="_blank" rel="noopener noreferrer">
        <span class="spotify-dot"></span>Open in Spotify
      </a>
    </div>
  </div>

  <form id="songForm" class="editor">
    <input
      id="songInput"
      class="input"
      type="url"
      inputmode="url"
      autocomplete="off"
      placeholder="Paste Spotify track link…"
      aria-label="Spotify track URL"
      required
    >
    <button class="button" type="submit">Set Song</button>
  </form>

  <div id="message" class="message"></div>
</section>

<script>
const STORAGE_KEY = "song-of-the-day-spotify-url-v1";

const form = document.getElementById("songForm");
const input = document.getElementById("songInput");
const title = document.getElementById("title");
const cover = document.getElementById("cover");
const spotify = document.getElementById("spotify");
const message = document.getElementById("message");
const date = document.getElementById("date");

date.textContent = new Intl.DateTimeFormat("en-CA", {
  timeZone: "America/Toronto",
  month: "long",
  day: "numeric",
  year: "numeric"
}).format(new Date());

function isSpotifyTrack(url) {
  try {
    const u = new URL(url);
    return (u.hostname === "open.spotify.com" || u.hostname === "www.open.spotify.com")
      && u.pathname.startsWith("/track/");
  } catch {
    return false;
  }
}

async function setSong(url, save = true) {
  url = url.trim();

  if (!isSpotifyTrack(url)) {
    message.textContent = "Please paste a Spotify track link.";
    return;
  }

  title.textContent = "Loading…";
  message.textContent = "";
  spotify.href = url;
  spotify.style.display = "inline-flex";

  try {
    const endpoint = "https://open.spotify.com/oembed?url=" + encodeURIComponent(url);
    const response = await fetch(endpoint);
    if (!response.ok) throw new Error("Metadata request failed");

    const data = await response.json();

    title.textContent = data.title || "Spotify track";

    if (data.thumbnail_url) {
      cover.src = data.thumbnail_url;
      cover.alt = (data.title || "Spotify") + " artwork";
      cover.style.display = "block";
    } else {
      cover.style.display = "none";
    }

    input.value = url;

    if (save) {
      localStorage.setItem(STORAGE_KEY, url);
      message.textContent = "Song saved on this device.";
    }
  } catch (err) {
    title.textContent = "Spotify song";
    cover.style.display = "none";
    message.textContent = "The Spotify link is valid, but its artwork could not be loaded.";
  }
}

form.addEventListener("submit", (event) => {
  event.preventDefault();
  setSong(input.value, true);
});

const savedSong = localStorage.getItem(STORAGE_KEY);
if (savedSong) setSong(savedSong, false);
</script>
</body>
</html>
